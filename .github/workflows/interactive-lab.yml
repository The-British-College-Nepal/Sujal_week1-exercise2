name: "SSD Interactive Lab: Vehicle Hierarchy"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade_and_advance:
    # Only run when a student creates and pushes to their own repository, not the root template
    if: ${{ !github.event.repository.is_template }}
    name: "Evaluate Code & Advance Step"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Student Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Evaluator & Step Tracker
        run: |
          chmod +x .github/scripts/check_progress.sh
          ./.github/scripts/check_progress.sh
